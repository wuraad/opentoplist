version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vpn_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  control-plane:
    build: .
    ports:
      - "8080:8080"
    environment:
      - STORE_BACKEND=postgres
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/vpn_db
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - JWT_SECRET=change-me-in-production-use-a-64-char-random-string
      - USE_JWT=0
      - ALERT_WEBHOOK_URL=
      - NODE_AUTH_KEY=
      - TLS_CERT=
      - TLS_KEY=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pg-data:
